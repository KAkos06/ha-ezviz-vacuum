name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install -r requirements_test.txt ruff
      - name: Lint
        run: python -m ruff check custom_components tests
      - name: Test
        run: python -m pytest
      - name: Verify tag matches manifest version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/ezviz_vacuum/manifest.json").read_text()
          )
          expected = f"v{manifest['version']}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(
                  f"Tag {actual!r} does not match manifest version {expected!r}"
              )
          PY
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$ ]]; then
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag --prerelease
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
